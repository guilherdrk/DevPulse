<div class="card">
    <h2 class="card-title">Novo projeto</h2>
    <p class="card-subtitle">Cadastre um projeto para acompanhar no hub.</p>

    <form [formGroup]="form" (ngSubmit)='onSubmit()'>
        <div class="field">
            <label for="name">Nome do Projeto</label>
            <input type="text" id="name" formControlName="name"
                [class.error]="form.get('name')?.invalid && form.get('name')?.touched">
        </div>
        <div class="field">
            <label for="description">Descrição</label>
            <textarea id="description" formControlName="description"
                [class.error]="form.get('description')?.invalid && form.get('description')?.touched"></textarea>

        </div>
        <div class="field">
            <label for="repoUrl">URL do repositório</label>
            <input type="text" id="repoUrl" formControlName="repoUrl"
                [class.error]="form.get('repoUrl')?.invalid && form.get('repoUrl')?.touched">
        </div>

        <div class="actions">
            <button type="submit" [disabled]="submitting() || form.invalid">Salvar</button>
            @if(errorMessage()){
            <span class="error-message">{{ errorMessage() }}</span>
            }

            @if(project()){
            <button type="button" (click)="cancelled.emit()" class="btn-cancel">Cancelar</button>
            }
        </div>
    </form>
</div>
