<div class="app-layout">
    <header class="app-header">
        <div class="header-container">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Devpulse</span>
            </div>
            <div class="badge">Hub de Métricas & Projetos</div>
        </div>
    </header>

    <main class="main-content">
        <div class="dashboard-grid">
            <section class="form-section">
                <app-project-form [project]="editingProject()"
                    (projectSaved)="projectList.upsertProject($event); editingProject.set(null)"
                    (cancelled)="editingProject.set(null)">
                </app-project-form>
            </section>

            <section class="list-section">
                <app-project-list #projectList (editRequested)="editingProject.set($event)">
                </app-project-list>
            </section>
        </div>
    </main>
</div>
